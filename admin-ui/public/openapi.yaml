  /api/v1/experiments/{id}:
    parameters:
      - $ref: '#/components/parameters/ExperimentId'
    get:
      tags: [Experiments]
      summary: An experiment
      description: "Auth: admin."
      responses:
        '200':
          description: Experiment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
