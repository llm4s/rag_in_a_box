openapi: 3.0.3
info:
  title: RAG in a Box API
  description: |
    REST API of RAG in a Box, a RAG (retrieval-augmented generation) server built on
    [llm4s](https://github.com/llm4s/llm4s).

    ## Authentication

    Which credentials are accepted depends on `AUTH_MODE`:

    | Credential | open | open + `API_KEY` | basic | oauth |
    |---|---|---|---|---|
    | none (every request is an anonymous administrator) | yes | | | |
    | static `API_KEY` (`X-API-Key` or `Authorization: Bearer`) | | yes | if set | if set |
    | `rat_…` access token (`Authorization: Bearer`) | | yes | yes | yes |
    | JWT from `POST /api/v1/auth/login` (`Authorization: Bearer`) | | | yes | |
    | OIDC session cookie (`ragbox_session`) | | | | yes |

    `GET /ws` additionally accepts `?access_token=<token>` because browsers cannot set headers
    on a WebSocket handshake. A request that presents an invalid credential is rejected with 401
    even if another credential would have been valid.

    ## Authorization

    Each operation's description states who may call it:

    - **Public**: no credentials needed.
    - **Authenticated**: any authenticated principal. Access tokens without the `admin` scope may
      only call documents, stats, sync, query/search, chat, `GET /api/v1/collections`,
      `/api/v1/auth/me` and `/ws`, and need the scope named for the operation.
    - **Admin**: administrators only: admin users, the static API key, `admin`-scoped access
      tokens, and everyone in open mode without an API key.

    Non-admin principals only see the collections their permissions (and, for access tokens,
    their collection restriction) allow.

    ## Errors

    Errors have a JSON body `{"error": "<code>", "message": "<text>", "details": "<optional>"}`.
    (The error-handling work in #22 may tighten what `details` contains.)
  version: 0.2.0
  contact:
    name: RAG in a Box
    url: https://github.com/llm4s/rag_in_a_box
  license:
    name: MIT
    url: https://github.com/llm4s/rag_in_a_box/blob/main/LICENSE

servers:
  - url: /
    description: This server

security:
  - bearerAuth: []
  - apiKeyHeader: []
  - sessionCookie: []

tags:
  - name: Health
    description: Liveness, readiness and metrics (public)
  - name: Auth
    description: Login, the current principal, and password-login users
  - name: OAuth
    description: OIDC login flow (only when AUTH_MODE=oauth)
  - name: Tokens
    description: Access tokens (`rat_…`) for external ingesters and integrations
  - name: Documents
    description: Document ingestion, listing and deletion
  - name: Sync
    description: Sync protocol for external ingesters
  - name: Query
    description: Retrieval and answer generation
  - name: Chat
    description: Multi-turn chat sessions over the RAG pipeline
  - name: Collections
    description: Collections, their permissions and their chunking configuration
  - name: Principals
    description: Users and groups referenced by collection permissions
  - name: Configuration
    description: Static and runtime configuration
  - name: Chunking
    description: Chunking preview and comparison
  - name: Ingestion
    description: Server-side ingestion from directories, URLs and configured sources
  - name: Visibility
    description: Inspect chunks, statistics and effective configuration
  - name: Analytics
    description: Query logs, feedback and optimization suggestions
  - name: Experiments
    description: A/B experiments between retrieval configurations
  - name: Realtime
    description: WebSocket updates

paths:
  # ============================================================
  # Health and metrics
  # ============================================================
  /health:
    get:
      tags: [Health]
      summary: Health status
      description: "Auth: public."
      security: []
      responses:
        '200':
          description: Server status, version, uptime and JVM information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: "Auth: public. Ready when the database and the RAG pipeline are available."
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      description: "Auth: public."
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: |
        Auth: admin by default (`METRICS_REQUIRE_AUTH=true`); public when
        `METRICS_REQUIRE_AUTH=false`. Not served at all when `METRICS_ENABLED=false`.
      responses:
        '200':
          description: Metrics in the Prometheus text format
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # Auth and users
  # ============================================================
  /api/v1/auth/mode:
    get:
      tags: [Auth]
      summary: Which login methods the server accepts
      description: "Auth: public. Used by the admin UI to pick its login screen."
      security: []
      responses:
        '200':
          description: Authentication mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthModeResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange a username and password for a JWT
      description: |
        Auth: public. Only available when `AUTH_MODE=basic` (400 otherwise). The JWT is valid
        for `JWT_EXPIRATION` seconds (default 86400) and is sent as `Authorization: Bearer`.
        Failed attempts are throttled per client IP and per username
        (`RATE_LIMIT_LOGIN_MAX_ATTEMPTS` per `RATE_LIMIT_LOGIN_WINDOW_SECONDS`), even when the
        general rate limit is off.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: The authenticated principal
      description: "Auth: authenticated (any access token)."
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/password:
    put:
      tags: [Auth]
      summary: Change your own password
      description: "Auth: authenticated; only password-login users (basic mode) have a password."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users:
    get:
      tags: [Auth]
      summary: List password-login users
      description: "Auth: admin."
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Auth]
      summary: Create a password-login user
      description: "Auth: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/{id}:
    delete:
      tags: [Auth]
      summary: Delete a user
      description: "Auth: admin. The user's JWTs stop working immediately."
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/{id}/password:
    put:
      tags: [Auth]
      summary: Reset a user's password
      description: "Auth: admin."
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # OAuth (AUTH_MODE=oauth only)
  # ============================================================
  /api/v1/oauth/login:
    get:
      tags: [OAuth]
      summary: Start the OIDC login flow
      description: |
        Auth: public; only mounted when `AUTH_MODE=oauth`. Redirects to the identity provider
        (authorization code flow with PKCE) and sets a short-lived login cookie that binds the
        callback to this browser.
      security: []
      parameters:
        - name: redirect_after
          in: query
          description: Relative path to return to after login (anything else falls back to `/admin/`)
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the identity provider

  /api/v1/oauth/callback:
    get:
      tags: [OAuth]
      summary: OIDC authorization callback
      description: |
        Auth: public; only mounted when `AUTH_MODE=oauth`. Exchanges the code, validates the ID
        token, creates a session, sets the session cookie and redirects to the admin UI.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Logged in; redirect to the admin UI
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/oauth/logout:
    post:
      tags: [OAuth]
      summary: End the OIDC session
      description: "Auth: public (acts on the session cookie, if any); only mounted when `AUTH_MODE=oauth`."
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Message'

  /api/v1/oauth/userinfo:
    get:
      tags: [OAuth]
      summary: The user of the current OIDC session
      description: "Auth: OIDC session cookie; only mounted when `AUTH_MODE=oauth`."
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthUserInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # Access tokens
  # ============================================================
  /api/v1/tokens:
    get:
      tags: [Tokens]
      summary: List access tokens
      description: "Auth: admin."
      responses:
        '200':
          description: Tokens (without their secret values)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Tokens]
      summary: Create an access token
      description: "Auth: admin. The token value is only returned once, in this response."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Tokens]
      summary: Get an access token's details
      description: "Auth: admin."
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tokens]
      summary: Revoke an access token
      description: "Auth: admin."
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Documents
  # ============================================================
  /api/v1/documents:
    get:
      tags: [Documents]
      summary: List documents
      description: "Auth: authenticated; access tokens need `documents:read`. Only documents in visible collections are listed."
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          description: Items per page (default 50, max 500)
          schema:
            type: integer
            default: 50
            maximum: 500
        - name: collection
          in: query
          description: Exact collection
          schema:
            type: string
        - name: search
          in: query
          description: Case-insensitive substring of the id, filename or title
          schema:
            type: string
      responses:
        '200':
          description: A page of documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Documents]
      summary: Add a document (text content)
      description: |
        Auth: authenticated; access tokens need `documents:write` and access to the collection.
        The server generates the document id. Use `PUT /api/v1/documents/{id}` for idempotent
        upserts with your own ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
      responses:
        '201':
          description: Document ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Documents]
      summary: Delete several documents, or every document
      description: |
        - With a `BatchDeleteRequest` body: delete the listed documents (authenticated; access
          tokens need `documents:write`; every document must be in an accessible collection).
        - With `?all=true` and no body: delete every document. Auth: admin.

        Anything else (no body and no `all=true`, a malformed body, or both) is a 400.
      parameters:
        - name: all
          in: query
          description: "`true` (and no body) to delete every document"
          schema:
            type: boolean
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteRequest'
      responses:
        '200':
          description: 'Documents deleted (`?all=true` answers `{"message": "All documents cleared"}`)'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BatchDeleteResponse'
                  - $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/documents/upload:
    post:
      tags: [Documents]
      summary: Upload a file
      description: |
        Auth: authenticated; access tokens need `documents:write` and access to the collection.
        Text is extracted with llm4s's Apache Tika extractor (PDF, DOCX, HTML, Markdown, plain
        text, …) and ingested like `POST /api/v1/documents`. The body size limit is
        `MAX_BODY_SIZE_MB`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                collection:
                  type: string
                metadata:
                  type: string
                  description: A JSON object of string values
                  example: '{"source": "handbook"}'
                readableBy:
                  type: string
                  description: Comma-separated principals, e.g. `user:alice,group:eng`
      responses:
        '201':
          description: Document ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/v1/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      summary: Get a document's metadata
      description: |
        Auth: authenticated; access tokens need `documents:read`. Returns registry metadata;
        chunk content is served by `GET /api/v1/visibility/chunks/{docId}`.
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Documents]
      summary: Create or update a document with your own id (idempotent)
      description: |
        Auth: authenticated; access tokens need `documents:write` and access to the collection.
        The document is re-indexed only if its content hash changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpsertRequest'
      responses:
        '200':
          description: Updated or unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUpsertResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUpsertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Documents]
      summary: Delete a document
      description: "Auth: authenticated; access tokens need `documents:write` and access to its collection."
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/stats:
    get:
      tags: [Documents]
      summary: Document, chunk and collection counts
      description: "Auth: authenticated; access tokens need `documents:read`."
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # Sync (external ingesters)
  # ============================================================
  /api/v1/sync/status:
    get:
      tags: [Sync]
      summary: Sync status
      description: "Auth: admin, or an access token with `sync:read`."
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sync:
    post:
      tags: [Sync]
      summary: Mark a sync complete and optionally prune
      description: |
        Auth: admin, or an access token with `sync:write`. Without a body, only records the sync
        time. With `keepDocumentIds`, deletes every other document (a collection-restricted token
        only prunes within its collections); `dryRun: true` reports what would be deleted.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPruneRequest'
      responses:
        '200':
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPruneResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sync/documents:
    get:
      tags: [Sync]
      summary: List document sync states
      description: "Auth: admin, or an access token with `sync:read`. Paged; `total` counts every matching document."
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          description: Documents per page (default 1000, max 10000)
          schema:
            type: integer
            default: 1000
            maximum: 10000
        - name: include
          in: query
          description: Comma-separated extra fields to include (`hash`, `updatedAt`)
          schema:
            type: string
            example: hash,updatedAt
        - name: since
          in: query
          description: Only documents updated since this ISO-8601 instant
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Document states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSyncListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sync/documents/{id}:
    get:
      tags: [Sync]
      summary: One document's sync state
      description: "Auth: admin, or an access token with `sync:read`."
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document state (with hash and updatedAt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSyncState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sync/check:
    post:
      tags: [Sync]
      summary: Check which documents exist
      description: "Auth: admin, or an access token with `sync:read`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncCheckRequest'
      responses:
        '200':
          description: Found and missing documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncCheckResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # Query
  # ============================================================
  /api/v1/query:
    post:
      tags: [Query]
      summary: Answer a question from the indexed documents
      description: |
        Auth: authenticated; access tokens need `query` and may only query their collections.
        Retrieval is filtered by the principal's collection permissions. While an experiment is
        running, the query may be assigned to its variant configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Answer with the contexts it was based on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/query/stream:
    post:
      tags: [Query]
      summary: Answer a question, as server-sent events
      description: |
        Auth: as `POST /api/v1/query`. Each SSE `data` is a JSON object whose `event` field is
        `start`, `context` (one per context), `answer`, `usage`, `complete` or `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/search:
    post:
      tags: [Query]
      summary: Retrieve matching chunks without generating an answer
      description: "Auth: authenticated; access tokens need `query` and may only search their collections."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Matching chunks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/feedback:
    post:
      tags: [Analytics]
      summary: Rate a query's answer
      description: "Auth: authenticated (access tokens need the `admin` scope)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryFeedbackRequest'
      responses:
        '200':
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Chat
  # ============================================================
  /api/v1/chat/sessions:
    get:
      tags: [Chat]
      summary: List your chat sessions
      description: "Auth: authenticated; access tokens need `query`. Users only see their own sessions."
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Chat]
      summary: Start a chat session
      description: "Auth: authenticated; access tokens need `query` and access to the collection pattern."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChatSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/chat/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Chat]
      summary: A session with its latest messages
      description: "Auth: authenticated; access tokens need `query`. Only the session's owner (or an admin) can see it."
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Session and messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Chat]
      summary: Rename, re-scope or archive a session
      description: "Auth: as GET."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChatSessionRequest'
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Chat]
      summary: Delete a session
      description: "Auth: as GET."
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/sessions/{id}/messages:
    post:
      tags: [Chat]
      summary: Send a message and get the answer
      description: |
        Auth: as GET of the session. The answer uses the session's earlier turns as context.
        If answering fails, the assistant message holds the error and `error` is set.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '200':
          description: The stored user and assistant messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  userMessage:
                    $ref: '#/components/schemas/ChatMessage'
                  assistantMessage:
                    $ref: '#/components/schemas/ChatMessage'
                  error:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/sessions/{id}/messages/stream:
    post:
      tags: [Chat]
      summary: Send a message, answer as server-sent events
      description: |
        Auth: as GET of the session. Events: `start`, `context`, `answer`, `usage`, `complete`
        (or `error`). The answer arrives as one event once complete.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/messages/{id}/rate:
    put:
      tags: [Chat]
      summary: Rate an assistant message (1-5)
      description: "Auth: authenticated; access tokens need `query`. Only messages in your own sessions."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
      responses:
        '200':
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Collections
  # ============================================================
  /api/v1/collections:
    get:
      tags: [Collections]
      summary: Names of the collections you can see
      description: "Auth: authenticated; access tokens need `documents:read`."
      responses:
        '200':
          description: Collection names
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Collections]
      summary: Create a collection with permissions
      description: "Auth: admin. Requires the PostgreSQL permission-aware search index."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Collection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/collections/accessible:
    get:
      tags: [Collections]
      summary: Collections you may query
      description: "Auth: authenticated (access tokens need the `admin` scope)."
      parameters:
        - $ref: '#/components/parameters/CollectionPatternQuery'
      responses:
        '200':
          description: Collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/collections/configs:
    get:
      tags: [Collections]
      summary: Chunking configuration of every collection
      description: "Auth: authenticated (access tokens need the `admin` scope)."
      responses:
        '200':
          description: Collection configurations and the default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllCollectionConfigsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/collections/{path}:
    parameters:
      - $ref: '#/components/parameters/CollectionPath'
    get:
      tags: [Collections]
      summary: A collection and its permissions
      description: |
        Auth: authenticated (access tokens need the `admin` scope). Non-admins get 404 for
        collections they cannot see. The path may contain slashes (`/collections/eng/backend`).
      responses:
        '200':
          description: Collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Collections]
      summary: Delete a collection
      description: "Auth: admin."
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/collections/{path}/permissions:
    put:
      tags: [Collections]
      summary: Replace who may query a collection
      description: "Auth: admin. An empty list makes the collection public."
      parameters:
        - $ref: '#/components/parameters/CollectionPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queryableBy]
              properties:
                queryableBy:
                  type: array
                  items:
                    type: string
                  example: ["user:alice", "group:engineering"]
      responses:
        '200':
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/collections/{path}/stats:
    get:
      tags: [Collections]
      summary: Document and chunk counts of a collection
      description: "Auth: authenticated (access tokens need the `admin` scope); 404 for collections you cannot see."
      parameters:
        - $ref: '#/components/parameters/CollectionPath'
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  documentCount:
                    type: integer
                    format: int64
                  chunkCount:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/collections/{collection}/config:
    parameters:
      - name: collection
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Collections]
      summary: A collection's chunking configuration
      description: "Auth: authenticated (access tokens need the `admin` scope)."
      responses:
        '200':
          description: Custom and effective configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Collections]
      summary: Set a collection's chunking configuration
      description: "Auth: admin. Applies to documents ingested afterwards."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionConfigUpdateRequest'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: string
                  config:
                    $ref: '#/components/schemas/CollectionChunkingConfig'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Collections]
      summary: Remove a collection's custom chunking configuration
      description: "Auth: admin."
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: string
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/collections/{collection}/config/preview:
    post:
      tags: [Collections]
      summary: Which chunking configuration a file would get
      description: "Auth: admin."
      parameters:
        - name: collection
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection]
              properties:
                collection:
                  type: string
                filename:
                  type: string
      responses:
        '200':
          description: Effective configuration and how it was resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: string
                  filename:
                    type: string
                  effectiveConfig:
                    $ref: '#/components/schemas/EffectiveChunkingConfig'
                  configResolutionPath:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # Principals
  # ============================================================
  /api/v1/principals/users:
    get:
      tags: [Principals]
      summary: List user principals
      description: "Auth: admin. Requires the PostgreSQL permission-aware search index."
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Principals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Principals]
      summary: Create (or get) a user principal
      description: "Auth: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrincipalRequest'
      responses:
        '201':
          description: Principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/principals/groups:
    get:
      tags: [Principals]
      summary: List group principals
      description: "Auth: admin."
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Principals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Principals]
      summary: Create (or get) a group principal
      description: "Auth: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrincipalRequest'
      responses:
        '201':
          description: Principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/principals/lookup/{externalId}:
    get:
      tags: [Principals]
      summary: Look up a principal by external id
      description: "Auth: admin."
      parameters:
        - name: externalId
          in: path
          required: true
          description: e.g. `user:alice` or `group:engineering`
          schema:
            type: string
      responses:
        '200':
          description: Principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/principals/{type}/{externalId}:
    delete:
      tags: [Principals]
      summary: Delete a principal
      description: "Auth: admin."
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [users, user, groups, group]
        - name: externalId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # Configuration
  # ============================================================
  /api/v1/config:
    get:
      tags: [Configuration]
      summary: Effective configuration (no secrets)
      description: "Auth: authenticated (access tokens need the `admin` scope)."
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Configuration]
      summary: Not supported
      description: |
        Auth: admin. Always answers 400: static configuration comes from the environment and
        needs a restart. Change the runtime settings with `PUT /api/v1/config/runtime`.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/config/providers:
    get:
      tags: [Configuration]
      summary: Available embedding and LLM providers, chunking and fusion strategies
      description: "Auth: authenticated (access tokens need the `admin` scope)."
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/config/runtime:
    get:
      tags: [Configuration]
      summary: Runtime settings
      description: "Auth: authenticated (access tokens need the `admin` scope)."
      responses:
        '200':
          description: Current runtime settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Configuration]
      summary: Change runtime settings
      description: |
        Auth: admin. Hot settings (topK, fusionStrategy, rrfK, systemPrompt, llmTemperature)
        apply to the next query; warm settings (chunkingStrategy, chunkSize, chunkOverlap) to
        documents ingested afterwards. Changes are persisted and recorded in the history.
        Invalid values answer 400 with error `validation_failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeConfigUpdate'
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/config/runtime/validate:
    post:
      tags: [Configuration]
      summary: Validate runtime setting changes without applying them
      description: "Auth: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeConfigUpdate'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigValidateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/config/runtime/history:
    get:
      tags: [Configuration]
      summary: History of runtime setting changes
      description: "Auth: admin."
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of changes, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/config/runtime/meta:
    get:
      tags: [Configuration]
      summary: Descriptions of the runtime settings
      description: "Auth: authenticated (access tokens need the `admin` scope)."
      responses:
        '200':
          description: One entry per setting
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                    type:
                      type: string
                      enum: [hot, warm, cold]
                    description:
                      type: string
                    requiresRestart:
                      type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # Chunking
  # ============================================================
  /api/v1/chunking/preview:
    post:
      tags: [Chunking]
      summary: Chunk text without ingesting it
      description: "Auth: authenticated (access tokens need the `admin` scope)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChunkingPreviewRequest'
      responses:
        '200':
          description: Chunks, statistics and warnings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkingPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/chunking/compare:
    post:
      tags: [Chunking]
      summary: Compare chunking strategies on the same text
      description: "Auth: authenticated (access tokens need the `admin` scope)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChunkingCompareRequest'
      responses:
        '200':
          description: Results per strategy and a recommendation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkingCompareResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/chunking/strategies:
    get:
      tags: [Chunking]
      summary: Chunking strategies
      description: "Auth: authenticated (access tokens need the `admin` scope)."
      responses:
        '200':
          description: Strategies and the current default
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        displayName:
                          type: string
                        description:
                          type: string
                        bestFor:
                          type: array
                          items:
                            type: string
                        tradeoffs:
                          type: array
                          items:
                            type: string
                        requiresEmbeddings:
                          type: boolean
                  currentDefault:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/chunking/presets:
    get:
      tags: [Chunking]
      summary: Chunk-size presets
      description: "Auth: authenticated (access tokens need the `admin` scope)."
      responses:
        '200':
          description: Presets and the current settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChunkingPreset'
                  current:
                    $ref: '#/components/schemas/ChunkingPreset'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # Ingestion
  # ============================================================
  /api/v1/ingest/directory:
    post:
      tags: [Ingestion]
      summary: Ingest a directory on the server
      description: |
        Auth: admin. The path must be under an allowed root (`INGEST_ALLOWED_ROOTS`; by default the configured directory sources, i.e. `INGEST_DIR`). Files are
        matched by `patterns` (default `*.md`, `*.txt`, `*.pdf`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryIngestRequest'
      responses:
        '200':
          description: Ingestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Ingestion failed (`error` is set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'

  /api/v1/ingest/url:
    post:
      tags: [Ingestion]
      summary: Ingest web pages
      description: |
        Auth: admin. URLs are checked against the ingestion URL policy (no private or
        link-local addresses unless `INGEST_URL_ALLOW_PRIVATE_NETWORKS=true`; optional host
        allowlist `INGEST_URL_ALLOWED_HOSTS`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlIngestRequest'
      responses:
        '200':
          description: Ingestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Ingestion failed (`error` is set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'

  /api/v1/ingest/run:
    post:
      tags: [Ingestion]
      summary: Run every configured ingestion source
      description: "Auth: admin. Each source syncs its own documents: files removed from a source are removed from the index."
      responses:
        '200':
          description: One result per source
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ingest/run/{source}:
    post:
      tags: [Ingestion]
      summary: Run one configured ingestion source
      description: "Auth: admin."
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ingestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Ingestion failed (`error` is set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'

  /api/v1/ingest/status:
    get:
      tags: [Ingestion]
      summary: Ingestion status
      description: "Auth: admin."
      responses:
        '200':
          description: Status, last results and configured sources
          content:
            application/json:
              schema:
