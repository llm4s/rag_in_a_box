name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # OWASP dependency check. Blocking: fails the build on any dependency with a
  # CVSS score >= 9 that is not suppressed in suppression.xml.
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Run dependency check
        # Pinned to a commit: the action's only release tags date from 2021
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main @ 2025-12-10
        id: depcheck
        with:
          project: 'rag-in-a-box'
          path: '.'
          format: 'SARIF'
          out: 'reports'
          args: >
            --suppression suppression.xml
            --failOnCVSS 9
            --enableExperimental

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        with:
          sarif_file: reports/dependency-check-report.sarif

  # Build and test the Admin UI
  admin-ui:
    name: Admin UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Run unit tests
        run: npm run test:run

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: admin-ui-dist
          path: admin-ui/dist
          retention-days: 1

  # Build and test the Scala backend
  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: admin-ui

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # sbt-dynver derives the version from git tags

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Download admin-ui build
        uses: actions/download-artifact@v8
        with:
          name: admin-ui-dist
          path: admin-ui/dist

      - name: Compile
        run: sbt compile

      - name: Run tests with coverage
        run: sbt clean coverage test coverageReport coverageAggregate
        # Coverage minimum (20%) enforced via coverageFailOnMinimum in build.sbt

      - name: Locate coverage report
        id: coverage
        if: always()
        run: |
          report=$(find target -path '*/scoverage-report/scoverage.xml' | head -n 1)
          echo "Coverage report: ${report:-<none>}"
          echo "report=${report}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        if: steps.coverage.outputs.report != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage.outputs.report }}
          fail_ci_if_error: false
          verbose: true

      - name: Build assembly JAR
        run: sbt assembly

  # Playwright end-to-end tests: the built admin UI against the real backend and
  # PostgreSQL, with a stub OpenAI-compatible API (admin-ui/e2e/support/stub-llm.mjs)
  # so no provider is called. Playwright starts the stub, the backend and the UI
  # (see admin-ui/playwright.config.ts).
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: ragdb
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # sbt-dynver derives the version from git tags

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install UI dependencies
        working-directory: admin-ui
        run: npm ci

      - name: Get Playwright version
        id: playwright
        working-directory: admin-ui
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: admin-ui
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: admin-ui
        run: npx playwright install-deps chromium

      # Compiled up front so the backend starts quickly under Playwright's webServer timeout
      - name: Compile backend
        run: sbt -batch compile

      - name: Run e2e tests
        working-directory: admin-ui
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            admin-ui/playwright-report
            admin-ui/test-results
          retention-days: 7

  # Lint and render the Helm chart
  helm:
    name: Helm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: |
          helm lint deploy/helm/ragbox \
            --set secrets.security.jwtSecret=ci-jwt-secret-0123456789abcdef0123456789 \
            --set secrets.security.adminPassword=ci-admin-password \
            --set postgresql.auth.password=ci-db-password

      - name: Render chart
        run: |
          helm template ragbox deploy/helm/ragbox \
            --set secrets.security.jwtSecret=ci-jwt-secret-0123456789abcdef0123456789 \
            --set secrets.security.adminPassword=ci-admin-password \
            --set postgresql.auth.password=ci-db-password \
            > /tmp/ragbox-rendered.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/ragbox-rendered.yaml) manifests"

  # Install the Python SDK and run its tests (HTTP mocked with `responses`)
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install SDK
        run: pip install ".[dev]"

      - name: Byte-compile and import
        run: |
          python -m compileall -q ragbox examples
          python -c "import ragbox; print('ragbox SDK imported OK')"

      - name: Run tests
        run: pytest -q

  # Build and push Docker image
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [admin-ui, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container security scan
        id: scan
        uses: anchore/scan-action@v7
        with:
          image: ghcr.io/${{ github.repository }}:latest
          fail-build: false
          severity-cutoff: critical

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
