services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ragbox-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RAG API Service (includes Admin UI at /admin)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragbox-api
    # Every variable in .env (see .env.example) is passed to the server, so all settings work
    # here as they do with ./run.sh; unset ones take the defaults in application.conf.
    # .env is optional.
    env_file:
      - path: .env
        required: false
    # Fixed by this compose setup; these take precedence over .env.
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      # The postgres service below. DATABASE_URL is cleared so a host-side URL in .env
      # (e.g. localhost:15432 for ./run.sh) does not override it.
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: ragdb
      PG_USER: rag
      PG_PASSWORD: rag
      DATABASE_URL: ""
      # The host directory INGEST_HOST_DIR (default ./data) is mounted at /data, so the
      # in-container path is always /data.
      INGEST_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      # Host directory to ingest from (set INGEST_HOST_DIR=/path/to/docs)
      - ${INGEST_HOST_DIR:-./data}:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: ragbox-network
