{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $secretName := include "ragbox.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "ragbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  {{- if not .Values.postgresql.enabled }}
  # External database credentials (only when postgresql.enabled=false)
  pg-user: {{ .Values.externalDatabase.username | default "rag" | quote }}
  pg-password: {{ .Values.externalDatabase.password | quote }}
  {{- end }}

  # Security secrets: generated on first install when not set, preserved on upgrade
  jwt-secret: {{ include "ragbox.secretValue" (dict "ctx" $ "secretName" $secretName "key" "jwt-secret" "value" .Values.secrets.security.jwtSecret) | quote }}
  admin-password: {{ include "ragbox.secretValue" (dict "ctx" $ "secretName" $secretName "key" "admin-password" "value" .Values.secrets.security.adminPassword) | quote }}

  # API keys
  openai-api-key: {{ .Values.secrets.apiKeys.openai | quote }}
  anthropic-api-key: {{ .Values.secrets.apiKeys.anthropic | quote }}
  voyage-api-key: {{ .Values.secrets.apiKeys.voyage | quote }}
{{- end }}
