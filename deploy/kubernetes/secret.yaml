# TEMPLATE - Do not commit with real values!
# Create secrets using kubectl:
#
#   kubectl create secret generic ragbox-secrets \
#     --namespace ragbox \
#     --from-literal=pg-user="rag" \
#     --from-literal=pg-password="your-secure-password" \
#     --from-literal=jwt-secret="your-32-char-random-secret" \
#     --from-literal=admin-password="your-admin-password" \
#     --from-literal=openai-api-key="sk-..."
#
# Or use external secrets operator, Vault, or sealed-secrets

apiVersion: v1
kind: Secret
metadata:
  name: ragbox-secrets
  namespace: ragbox
  labels:
    app.kubernetes.io/name: ragbox
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials
  pg-user: "rag"
  # The placeholders below are deliberately invalid: the jwt-secret is shorter
  # than the 32 characters the app requires, so ragbox refuses to start until
  # real values are supplied. Generate them with e.g. `openssl rand -base64 32`.
  pg-password: "REPLACE-ME"

  # JWT secret (32+ chars, must be same across all replicas)
  jwt-secret: "REPLACE-ME"

  # Admin password for basic auth
  admin-password: "REPLACE-ME"

  # API keys (add the ones you need)
  openai-api-key: ""
  anthropic-api-key: ""
  voyage-api-key: ""
