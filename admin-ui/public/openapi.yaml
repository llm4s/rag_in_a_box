  /api/v1/experiments/{id}/results:
    get:
      tags: [Experiments]
      summary: Per-variant metrics and significance tests
      description: |
        Auth: admin. Latency is compared with Welch's t-test, the error rate and share of
        positive ratings with a two-proportion z-test (α = 0.05).
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResults'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # WebSocket
  # ============================================================
  /ws:
    get:
      tags: [Realtime]
      summary: WebSocket for ingestion progress and stats updates
      description: |
        Auth: authenticated (any access token). Besides the usual credentials, the token may be
        passed as `?access_token=` because browsers cannot set headers on a WebSocket handshake.
        Server messages are JSON `{"type", "payload", "timestamp"}` (types include
        `ingestion_progress`, `stats_update` and heartbeats); client messages are ignored.
      security:
        - bearerAuth: []
        - wsAccessToken: []
        - sessionCookie: []
      responses:
        '101':
          description: Switching protocols
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <credential>` where the credential is the static `API_KEY`, a
        `rat_…` access token, or (basic mode) a JWT from `POST /api/v1/auth/login`.
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: The static `API_KEY`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: ragbox_session
      description: OIDC session cookie set by the OAuth callback (oauth mode; name set by `OAUTH_SESSION_COOKIE_NAME`).
    wsAccessToken:
      type: apiKey
      in: query
      name: access_token
      description: Any bearer credential, accepted on `GET /ws` only.

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 50
    Limit:
      name: limit
      in: query
      schema:
        type: integer
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    From:
      name: from
      in: query
      description: ISO-8601 start of the period
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: ISO-8601 end of the period
      schema:
        type: string
        format: date-time
    CollectionFilter:
      name: collection
      in: query
      schema:
        type: string
    CollectionPatternQuery:
      name: pattern
      in: query
      description: Collection pattern such as `*`, `eng/*` or `eng/**`
      schema:
        type: string
    CollectionPath:
      name: path
      in: path
      required: true
      description: |
        Collection path. `GET /api/v1/collections/{path}` accepts nested paths as is
        (`/collections/eng/backend`); the other operations take one path segment, so encode
        `/` as `%2F`.
      schema:
        type: string
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ExperimentId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Message:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    ExperimentOperation:
      description: Operation result
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              experiment:
                $ref: '#/components/schemas/Experiment'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials (with a `WWW-Authenticate` challenge)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated, but not allowed (not an admin, missing token scope, or collection not allowed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Body larger than `MAX_BODY_SIZE_MB` (the limit is also in the `X-Max-Body-Size` header)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              maxSizeBytes:
                type: string
              maxSizeMB:
                type: string
    TooManyRequests:
      description: Rate limited (see `Retry-After`)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              retryAfter:
                type: string
              limit:
                type: string
              window:
                type: string

  schemas:
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable code, e.g. `bad_request`, `unauthorized`, `forbidden`, `not_found`, `internal_error`
        message:
          type: string
        details:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    OperationResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    # ---------------- Health ----------------
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        uptime:
          type: integer
          format: int64
          description: Milliseconds since start
        system:
          type: object
          properties:
            memoryUsedMb:
              type: integer
            memoryMaxMb:
              type: integer
            memoryFreePercent:
              type: integer
            cpuCount:
              type: integer
            javaVersion:
              type: string
    ReadinessResponse:
      type: object
      properties:
        ready:
          type: boolean
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
              message:
                type: string

    # ---------------- Auth ----------------
    AuthModeResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [open, basic, oauth]
        authRequired:
          type: boolean
        methods:
          type: array
          items:
            type: string
            enum: [password, sso, api-key]
        oauthLoginUrl:
          type: string
          example: /api/v1/oauth/login
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        expiresIn:
          type: integer
          format: int64
          description: Seconds until the token expires
    PrincipalInfo:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
        isAdmin:
          type: boolean
        authMethod:
          type: string
          description: How the principal authenticated (e.g. open, api-key, access-token, password, oidc)
        groups:
          type: array
          items:
            type: string
        scopes:
          type: array
          description: Access tokens only
          items:
            type: string
        collections:
          type: array
          description: Access tokens restricted to collections only
          items:
            type: string
        userId:
          type: integer
          description: Password-login users only
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
    UserInfo:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserInfo'
        total:
          type: integer
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum: [admin, user]
          default: user
    OAuthUserInfo:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        name:
          type: string
        groups:
          type: array
          items:
            type: string

    # ---------------- Tokens ----------------
    CreateTokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: ["documents:read", "documents:write", "sync:read", "sync:write", query, admin]
        collections:
          type: array
          description: Restrict the token to these collections (default all)
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
    CreateTokenResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        token:
          type: string
          description: The full `rat_…` token; only returned on creation
        scopes:
          type: array
          items:
            type: string
        collections:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
    TokenInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tokenPrefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        collections:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    TokenListResponse:
      type: object
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TokenInfo'
        total:
          type: integer

    # ---------------- Documents ----------------
    Metadata:
      type: object
      additionalProperties:
        type: string
    DocumentUploadRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        filename:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        collection:
          type: string
          description: Defaults to `default`
        readableBy:
          type: array
          description: Principals allowed to read it (permission mode), e.g. `user:alice`, `group:eng`
          items:
            type: string
    DocumentUploadResponse:
      type: object
      properties:
        documentId:
          type: string
        chunks:
          type: integer
        message:
          type: string
    DocumentInfo:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        chunkCount:
          type: integer
        metadata:
          $ref: '#/components/schemas/Metadata'
        createdAt:
          type: string
          format: date-time
        collection:
          type: string
        updatedAt:
          type: string
          format: date-time
    DocumentListResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentInfo'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean
    DocumentUpsertRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        contentHash:
          type: string
          description: Your hash of the content; defaults to the server's SHA-256
        collection:
          type: string
        readableBy:
          type: array
          items:
            type: string
    DocumentUpsertResponse:
      type: object
      properties:
        documentId:
          type: string
        chunks:
          type: integer
        action:
          type: string
          enum: [created, updated, unchanged]
        message:
          type: string
    BatchDeleteRequest:
      type: object
      required: [documentIds]
      properties:
        documentIds:
          type: array
          items:
            type: string
        dryRun:
          type: boolean
    BatchDeleteResponse:
      type: object
      properties:
        message:
          type: string
        deletedCount:
          type: integer
        deletedIds:
          type: array
          items:
            type: string
        failedIds:
          type: array
          items:
            type: string
        dryRun:
          type: boolean
    StatsResponse:
      type: object
      properties:
        documentCount:
          type: integer
        chunkCount:
          type: integer
        vectorCount:
          type: integer
          format: int64
        collections:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              documentCount:
                type: integer
              chunkCount:
                type: integer

    # ---------------- Sync ----------------
    SyncStatusResponse:
      type: object
      properties:
        lastSyncTime:
          type: string
          format: date-time
        documentCount:
          type: integer
        chunkCount:
          type: integer
        pendingDeletes:
          type: integer
    SyncPruneRequest:
      type: object
      required: [keepDocumentIds]
      properties:
        keepDocumentIds:
          type: array
          items:
            type: string
        dryRun:
          type: boolean
    SyncPruneResponse:
      type: object
      properties:
        message:
          type: string
        prunedCount:
          type: integer
        prunedIds:
          type: array
          description: Only for dry runs
          items:
            type: string
        dryRun:
          type: boolean
    DocumentSyncState:
      type: object
      properties:
        id:
          type: string
        hash:
          type: string
        updatedAt:
          type: string
          format: date-time
        collection:
          type: string
    DocumentSyncListResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSyncState'
        total:
          type: integer
          description: Matching documents across all pages
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean
    SyncCheckRequest:
      type: object
      required: [documentIds]
      properties:
        documentIds:
          type: array
          items:
            type: string
    SyncCheckResponse:
      type: object
      properties:
        found:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSyncState'
        missing:
          type: array
          items:
            type: string

    # ---------------- Query ----------------
    QueryOverrides:
      type: object
      description: Per-request overrides of the runtime settings
      properties:
        topK:
          type: integer
        fusionStrategy:
          type: string
        systemPrompt:
          type: string
        llmTemperature:
          type: number
        similarityThreshold:
          type: number
    QueryRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        collection:
          type: string
          description: Collection or pattern (`*`, `eng/*`, `eng/**`)
        topK:
          type: integer
        includeMetadata:
          type: boolean
          default: true
        experimentId:
          type: string
        overrides:
          $ref: '#/components/schemas/QueryOverrides'
    ContextItem:
      type: object
      properties:
        content:
          type: string
        score:
          type: number
        metadata:
          $ref: '#/components/schemas/Metadata'
        documentId:
          type: string
        chunkIndex:
          type: integer
    UsageInfo:
      type: object
      properties:
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        totalTokens:
          type: integer
    QueryResponse:
      type: object
      properties:
        answer:
          type: string
        contexts:
          type: array
          items:
            $ref: '#/components/schemas/ContextItem'
        usage:
          $ref: '#/components/schemas/UsageInfo'
        metrics:
          type: object
          properties:
            embeddingLatencyMs:
              type: integer
            searchLatencyMs:
              type: integer
            llmLatencyMs:
              type: integer
            chunksRetrieved:
              type: integer
            chunksUsed:
              type: integer
            embeddingTokens:
              type: integer
            promptTokens:
              type: integer
            completionTokens:
              type: integer
            costUsd:
              type: number
    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        topK:
          type: integer
        collection:
          type: string
    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ContextItem'
        count:
          type: integer

    # ---------------- Chat ----------------
    ChatSession:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        collectionPattern:
          type: string
          default: '*'
        messageCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isArchived:
          type: boolean
        ownerId:
          type: string
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        contexts:
          type: array
          items:
            $ref: '#/components/schemas/ContextItem'
        usage:
          $ref: '#/components/schemas/UsageInfo'
        rating:
          type: integer
        queryLogId:
          type: string
        createdAt:
          type: string
          format: date-time
        messageIndex:
          type: integer
    CreateChatSessionRequest:
      type: object
      properties:
        title:
          type: string
        collectionPattern:
          type: string
    CreateChatSessionResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/ChatSession'
        message:
          type: string
    UpdateChatSessionRequest:
      type: object
      properties:
        title:
          type: string
        collectionPattern:
          type: string
        isArchived:
          type: boolean
    ChatSessionListResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ChatSession'
        total:
          type: integer
    ChatSessionDetailResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/ChatSession'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
    SendChatMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    # ---------------- Collections and principals ----------------
    CreateCollectionRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          example: engineering/backend
        description:
          type: string
        queryableBy:
          type: array
          description: External principal ids; empty or absent means public
          items:
            type: string
          example: ["group:engineering"]
        isLeaf:
          type: boolean
        metadata:
          $ref: '#/components/schemas/Metadata'
    Collection:
      type: object
      properties:
        id:
          type: integer
        path:
          type: string
        parentPath:
          type: string
        queryableBy:
          type: array
          description: Internal principal ids
          items:
            type: integer
        isLeaf:
          type: boolean
        isPublic:
          type: boolean
        metadata:
          $ref: '#/components/schemas/Metadata'
    CollectionListResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
    CreatePrincipalRequest:
      type: object
      required: [externalId]
      properties:
        externalId:
          type: string
          example: alice
    PrincipalRecord:
      type: object
      properties:
        id:
          type: integer
        externalId:
          type: string
        principalType:
          type: string
          enum: [user, group]
    PrincipalListResponse:
      type: object
      properties:
        principals:
          type: array
          items:
            $ref: '#/components/schemas/PrincipalRecord'
        total:
          type: integer
          format: int64
    CollectionChunkingConfig:
      type: object
      properties:
        collection:
          type: string
        strategy:
          type: string
        targetSize:
          type: integer
        maxSize:
          type: integer
        overlap:
          type: integer
        fileTypeStrategies:
          type: object
          additionalProperties:
            type: string
        updatedAt:
          type: string
          format: date-time
    CollectionConfigUpdateRequest:
      type: object
      properties:
        strategy:
          type: string
          enum: [simple, sentence, markdown, semantic]
        targetSize:
          type: integer
        maxSize:
          type: integer
        overlap:
          type: integer
        fileTypeStrategies:
          type: object
          description: 'File extension to strategy, e.g. `{".md": "markdown"}`'
          additionalProperties:
            type: string
    EffectiveChunkingConfig:
      type: object
      properties:
        strategy:
          type: string
        targetSize:
          type: integer
        maxSize:
          type: integer
        overlap:
          type: integer
        source:
          type: string
          description: Where the configuration came from (default, collection, file-type)
        appliedFileTypeOverride:
          type: string
    CollectionConfigResponse:
      type: object
      properties:
        collection:
          type: string
        hasCustomConfig:
          type: boolean
        config:
          $ref: '#/components/schemas/CollectionChunkingConfig'
        effectiveConfig:
          $ref: '#/components/schemas/EffectiveChunkingConfig'
        documentCount:
          type: integer
    AllCollectionConfigsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/CollectionConfigResponse'
        defaultConfig:
          $ref: '#/components/schemas/EffectiveChunkingConfig'

    # ---------------- Configuration ----------------
    ConfigResponse:
      type: object
      properties:
        embedding:
          type: object
          properties:
            provider:
              type: string
            model:
              type: string
            dimensions:
              type: integer
        llm:
          type: object
          properties:
            model:
              type: string
            temperature:
              type: number
        rag:
          type: object
          properties:
            chunkingStrategy:
              type: string
            chunkSize:
              type: integer
            chunkOverlap:
              type: integer
            topK:
              type: integer
            fusionStrategy:
              type: string
            rrfK:
              type: integer
            searchMode:
              type: string
            fusionApplies:
              type: boolean
            reranking:
              type: string
            queryTransform:
              type: string
            limitations:
              type: array
              items:
                type: string
        database:
          type: object
          properties:
            host:
              type: string
            port:
              type: integer
            database:
              type: string
            tableName:
              type: string
            connected:
              type: boolean
    ProvidersResponse:
      type: object
      properties:
        embeddingProviders:
          type: array
          items:
            $ref: '#/components/schemas/ProviderInfo'
        llmProviders:
          type: array
          items:
            $ref: '#/components/schemas/ProviderInfo'
        chunkingStrategies:
          type: array
          items:
            type: string
        fusionStrategies:
          type: array
          items:
            type: string
    ProviderInfo:
      type: object
      properties:
        name:
          type: string
        models:
          type: array
          items:
            type: string
        configured:
          type: boolean
    RuntimeConfig:
      type: object
      properties:
        topK:
          type: integer
        fusionStrategy:
          type: string
        rrfK:
          type: integer
        systemPrompt:
          type: string
        llmTemperature:
          type: number
        chunkingStrategy:
          type: string
        chunkSize:
          type: integer
        chunkOverlap:
          type: integer
    RuntimeConfigResponse:
      type: object
      properties:
        config:
          $ref: '#/components/schemas/RuntimeConfig'
        lastModified:
          type: string
          format: date-time
        hotSettings:
          type: array
          items:
            type: string
        warmSettings:
          type: array
          items:
            type: string
    RuntimeConfigUpdate:
      type: object
      description: Only the fields present are changed
      properties:
        topK:
          type: integer
        fusionStrategy:
          type: string
          enum: [rrf, weighted, vector_only, keyword_only]
        rrfK:
          type: integer
        systemPrompt:
          type: string
        llmTemperature:
          type: number
          minimum: 0
          maximum: 2
        chunkingStrategy:
          type: string
          enum: [simple, sentence, markdown, semantic]
        chunkSize:
          type: integer
        chunkOverlap:
          type: integer
    RuntimeConfigUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        changes:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              oldValue:
                type: string
              newValue:
                type: string
              changeability:
                type: string
                enum: [hot, warm]
              effectiveImmediately:
                type: boolean
              note:
                type: string
        current:
          $ref: '#/components/schemas/RuntimeConfig'
        message:
          type: string
    RuntimeConfigValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        validations:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              valid:
                type: boolean
              currentValue:
                type: string
              proposedValue:
                type: string
              error:
                type: string
              warning:
                type: string
        warnings:
          type: array
          items:
            type: string
    ConfigHistoryResponse:
      type: object
      properties:
        changes:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              field:
                type: string
              oldValue:
                type: string
              newValue:
                type: string
              changedAt:
                type: string
                format: date-time
              changedBy:
                type: string
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean

    # ---------------- Chunking ----------------
    ChunkingPreviewRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        strategy:
          type: string
          enum: [simple, sentence, markdown, semantic]
        targetSize:
          type: integer
        maxSize:
          type: integer
        overlap:
          type: integer
        filename:
          type: string
          description: Used to auto-detect the strategy when none is given
    PreviewChunk:
      type: object
      properties:
        index:
          type: integer
        content:
          type: string
        length:
          type: integer
        headings:
          type: array
          items:
            type: string
        isCodeBlock:
          type: boolean
        language:
          type: string
    ChunkingStats:
      type: object
      properties:
        chunkCount:
          type: integer
        totalLength:
          type: integer
        avgChunkSize:
          type: number
        minChunkSize:
          type: integer
        maxChunkSize:
          type: integer
        estimatedTokens:
          type: integer
    ChunkingWarning:
      type: object
      properties:
        level:
          type: string
          enum: [info, warning, error]
        message:
          type: string
        suggestion:
          type: string
    ChunkingPreviewResponse:
      type: object
      properties:
        strategy:
          type: string
        config:
          type: object
          properties:
            strategy:
              type: string
            targetSize:
              type: integer
            maxSize:
              type: integer
            overlap:
              type: integer
            source:
              type: string
              enum: [request, auto-detect, default]
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/PreviewChunk'
        stats:
          $ref: '#/components/schemas/ChunkingStats'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ChunkingWarning'
    ChunkingCompareRequest:
      type: object
      required: [content, strategies]
      properties:
        content:
          type: string
        strategies:
          type: array
          items:
            type: string
          example: [simple, sentence, markdown]
        targetSize:
          type: integer
        overlap:
          type: integer
    ChunkingCompareResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              strategy:
                type: string
              chunks:
                type: array
                items:
                  $ref: '#/components/schemas/PreviewChunk'
              stats:
                $ref: '#/components/schemas/ChunkingStats'
              warnings:
                type: array
                items:
                  $ref: '#/components/schemas/ChunkingWarning'
        recommendation:
          type: object
          properties:
            strategy:
              type: string
            reason:
              type: string
    ChunkingPreset:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        targetSize:
          type: integer
        maxSize:
          type: integer
        overlap:
          type: integer
        bestFor:
          type: array
          items:
            type: string

    # ---------------- Ingestion ----------------
    DirectoryIngestRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
        patterns:
          type: array
          items:
            type: string
          default: ["*.md", "*.txt", "*.pdf"]
        recursive:
          type: boolean
          default: true
        metadata:
          $ref: '#/components/schemas/Metadata'
    UrlIngestRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items:
            type: string
            format: uri
        metadata:
          $ref: '#/components/schemas/Metadata'
    IngestResult:
      type: object
      properties:
        sourceName:
          type: string
        sourceType:
          type: string
        documentsAdded:
          type: integer
        documentsUpdated:
          type: integer
        documentsDeleted:
          type: integer
        documentsUnchanged:
          type: integer
        documentsFailed:
          type: integer
        durationMs:
          type: integer
          format: int64
        error:
          type: string
    SourceInfo:
      type: object
      properties:
        name:
          type: string
        sourceType:
          type: string
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties:
            type: string
    IngestionStatusResponse:
      type: object
      properties:
        running:
          type: boolean
        lastRun:
          type: string
          format: date-time
        lastResults:
          type: array
          items:
            $ref: '#/components/schemas/IngestResult'
        nextScheduledRun:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceInfo'

    # ---------------- Visibility ----------------
    ChunkInfo:
      type: object
      properties:
        id:
          type: string
        documentId:
          type: string
        index:
          type: integer
        content:
          type: string
        contentLength:
          type: integer
        metadata:
          $ref: '#/components/schemas/Metadata'
        chunkMetadata:
          type: object
          properties:
            headings:
              type: array
              items:
                type: string
            isCodeBlock:
              type: boolean
            language:
              type: string
            startOffset:
              type: integer
            endOffset:
              type: integer
    ChunkListResponse:
      type: object
      properties:
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/ChunkInfo'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean

    # ---------------- Analytics ----------------
    QueryLogEntry:
      type: object
      properties:
        id:
          type: string
        queryText:
          type: string
        collectionPattern:
          type: string
        userId:
          type: string
        embeddingLatencyMs:
          type: integer
        searchLatencyMs:
          type: integer
        llmLatencyMs:
          type: integer
        totalLatencyMs:
          type: integer
        chunksRetrieved:
          type: integer
        chunksUsed:
          type: integer
        answerTokens:
          type: integer
        userRating:
          type: integer
        experimentId:
          type: string
        configSnapshot:
          type: object
          properties:
            topK:
              type: integer
            fusionStrategy:
              type: string
            systemPrompt:
              type: string
            llmTemperature:
              type: number
        createdAt:
          type: string
          format: date-time
        promptTokens:
          type: integer
        embeddingTokens:
          type: integer
        costUsd:
          type: number
        variant:
          type: string
          enum: [baseline, variant]
        failed:
          type: boolean
        errorMessage:
          type: string
    QueryLogListResponse:
      type: object
      properties:
        queries:
          type: array
          items:
            $ref: '#/components/schemas/QueryLogEntry'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    QueryAnalyticsSummary:
      type: object
      properties:
        totalQueries:
          type: integer
        averageLatencyMs:
          type: number
        p50LatencyMs:
          type: integer
        p95LatencyMs:
          type: integer
        p99LatencyMs:
          type: integer
        averageChunksRetrieved:
          type: number
        averageChunksUsed:
          type: number
        averageRating:
          type: number
        ratedQueriesCount:
          type: integer
        queriesWithFeedback:
          type: integer
        topCollections:
          type: array
          items:
            type: object
            properties:
              collection:
                type: string
              queryCount:
                type: integer
              averageLatencyMs:
                type: number
              averageRating:
                type: number
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        p95RetrievalLatencyMs:
          type: integer
        totalCostUsd:
          type: number
    QueryFeedbackRequest:
      type: object
      required: [queryId, rating]
      properties:
        queryId:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        relevantChunks:
          type: array
          items:
            type: string
        comment:
          type: string
    SuggestionsResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              suggestionType:
                type: string
                enum: [chunking, search, embedding, content]
              severity:
                type: string
                enum: [critical, warning, info]
              title:
                type: string
              description:
                type: string
              collection:
                type: string
              evidence:
                type: object
                properties:
                  metric:
                    type: string
                  currentValue:
                    type: number
                  threshold:
                    type: number
                  sampleSize:
                    type: integer
                  timeRange:
                    type: string
              recommendation:
                type: string
              estimatedImpact:
                type: string
              currentValue:
                type: string
              suggestedValue:
                type: string
              createdAt:
                type: string
                format: date-time
        analyzedQueries:
          type: integer
        analyzedCollections:
          type: integer
        analysisTimestamp:
          type: string
          format: date-time

    # ---------------- Experiments ----------------
    ExperimentConfig:
      type: object
      description: Settings that differ from the runtime configuration; absent fields use it
      properties:
        topK:
          type: integer
        fusionStrategy:
          type: string
        systemPrompt:
          type: string
        llmTemperature:
          type: number
        rrfK:
          type: integer
        reranking:
          type: string
    Experiment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, running, completed, archived]
        baselineConfig:
          $ref: '#/components/schemas/ExperimentConfig'
        variantConfig:
          $ref: '#/components/schemas/ExperimentConfig'
        trafficSplit:
          type: number
          description: Share of queries sent to the variant
        collection:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
    CreateExperimentRequest:
      type: object
      required: [name, variantConfig]
      properties:
        name:
          type: string
        description:
          type: string
        baselineConfig:
          $ref: '#/components/schemas/ExperimentConfig'
        variantConfig:
          $ref: '#/components/schemas/ExperimentConfig'
        trafficSplit:
          type: number
          default: 0.5
        collection:
          type: string
    VariantMetrics:
      type: object
      properties:
        queryCount:
          type: integer
        avgLatencyMs:
          type: number
        avgRating:
          type: number
        ratedCount:
          type: integer
        avgChunksUsed:
          type: number
        avgChunksRetrieved:
          type: number
        failedCount:
          type: integer
        errorRate:
          type: number
        latencyStdDevMs:
          type: number
        ratingStdDev:
          type: number
        positiveCount:
          type: integer
    ExperimentResults:
      type: object
      properties:
        experimentId:
          type: string
        experimentName:
          type: string
        status:
          type: string
        duration:
          type: string
        baseline:
          $ref: '#/components/schemas/VariantMetrics'
        variant:
          $ref: '#/components/schemas/VariantMetrics'
        analysis:
          type: object
          properties:
            latencyChange:
              type: string
            ratingChange:
              type: string
            chunksUsedChange:
              type: string
            errorRateChange:
              type: string
            tests:
              type: array
              items:
                type: object
                properties:
                  metric:
                    type: string
                  test:
                    type: string
                  baseline:
                    type: number
                  variant:
                    type: number
                  statistic:
                    type: number
                  pValue:
                    type: number
                  significant:
                    type: boolean
