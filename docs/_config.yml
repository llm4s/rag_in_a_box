# Site settings
title: RAG in a Box
description: >-
  RAG in a Box - a turnkey RAG server and LLM4S demonstrator. Start it with Docker
  Compose, point it at documents, and query them over a REST API or the admin UI.
baseurl: ""
url: "https://raginabox.dev"

# Author
author:
  name: RAG in a Box Team

# Build settings
markdown: kramdown
theme: just-the-docs
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Code block settings
enable_copy_code_button: true

# Kramdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Navigation: pages are organised with just-the-docs front matter (parent / nav_order /
# has_children): Home, Getting Started, User Guide, API Reference, Operations.
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/

# GitHub settings
github_username: llm4s

# ----- just-the-docs theme settings -----

# Aux links (appear in header)
aux_links:
  "GitHub":
    - "https://github.com/llm4s/rag_in_a_box"
  "LLM4S":
    - "https://llm4s.org"

aux_links_new_tab: true

# Enable "Edit this page on GitHub" link
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/llm4s/rag_in_a_box"
gh_edit_branch: "main"
gh_edit_source: "docs"
gh_edit_view_mode: "edit"

# Footer content
footer_content: >-
  RAG in a Box is released under the <a href="https://github.com/llm4s/rag_in_a_box/blob/main/LICENSE">MIT License</a>.
  Powered by <a href="https://llm4s.org">LLM4S</a>.

# Enable last modified date on pages
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

# Search settings
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Color scheme (light/dark)
color_scheme: light

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"
