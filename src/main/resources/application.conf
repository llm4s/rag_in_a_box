# RAG in a Box - Application Configuration

server {
  host = "0.0.0.0"
  host = ${?SERVER_HOST}
  port = 8080
  port = ${?SERVER_PORT}
}

database {
  # PostgreSQL connection settings
  host = "localhost"
  host = ${?PG_HOST}
  port = 15432
  port = ${?PG_PORT}
  database = "ragdb"
  database = ${?PG_DATABASE}
  user = "rag"
  user = ${?PG_USER}
  password = "rag"
  password = ${?PG_PASSWORD}

  # Table name for vector embeddings
  table-name = "rag_embeddings"
  table-name = ${?PG_TABLE_NAME}

  # Alternative: Use DATABASE_URL if provided. It overrides the settings above.
  # Format: postgresql://[user[:password]@]host[:port][/database][?params]
  # postgres:// and jdbc:postgresql:// are also accepted. Percent-encode special
  # characters in the user name or password. A missing port defaults to 5432; a
  # missing user, password or database falls back to the settings above.
  url = ${?DATABASE_URL}

  # Size of the single HikariCP pool shared by every component (registries, chunk
  # store, permission search index). Blocking JDBC runs on the blocking thread pool,
  # so this bounds concurrent database work, not request concurrency.
  pool-size = 10
  pool-size = ${?DB_POOL_SIZE}

  # Apply pending schema migrations (Flyway, classpath:db/migration) at startup, before
  # anything else uses the database. Replicas starting together are serialised by
  # Flyway's lock. Set to false when migrations run separately (`--migrate-only`, e.g.
  # from a deploy job); the server then expects the schema to be up to date.
  migrate-on-start = true
  migrate-on-start = ${?DB_MIGRATE_ON_START}
}

permissions {
  # When true, fail startup if permission-based RAG (the PgSearchIndex with its
  # permission schema) cannot be initialized. When false (the default), the server
  # logs a warning and falls back to legacy mode, in which queries ignore permissions.
  required = false
  required = ${?PERMISSIONS_REQUIRED}
}

embedding {
  # Provider: any llm4s embedding provider on the classpath (openai, voyage, ollama),
  # resolved through llm4s's ProviderRegistry
  provider = "openai"
  provider = ${?EMBEDDING_PROVIDER}

  # Model name (provider-specific)
  model = "text-embedding-3-small"
  model = ${?EMBEDDING_MODEL}

  # Embedding dimensions (taken from llm4s's model table if not specified)
  # dimensions = 1536
  dimensions = ${?EMBEDDING_DIMENSIONS}

  # Provider endpoint, when not the provider's default (e.g. a remote Ollama server)
  base-url = ${?EMBEDDING_BASE_URL}
}

llm {
  # LLM model for answer generation
  # Format: provider/model, where provider is any llm4s provider on the classpath
  # (e.g. openai/gpt-4o, anthropic/claude-sonnet-4-5, ollama/llama3.1)
  model = "openai/gpt-4o"
  model = ${?LLM_MODEL}

  # Provider endpoint, when not the provider's default. Ollama needs one unless it
  # runs on http://localhost:11434.
  base-url = ${?LLM_BASE_URL}

  # Temperature for chat answers. Single-shot /query answers are generated by llm4s
  # RAG.queryWithAnswer, which in llm4s 0.6.0 fixes temperature at 0.0 (llm4s/llm4s#2715).
  temperature = 0.1
  temperature = ${?LLM_TEMPERATURE}
}

rag {
  # Chunking settings
  chunking {
    # Strategy: simple, sentence, markdown, semantic
    strategy = "sentence"
    strategy = ${?RAG_CHUNKING_STRATEGY}

    # Target chunk size in characters
    size = 800
    size = ${?RAG_CHUNK_SIZE}

    # Overlap between chunks in characters
    overlap = 150
    overlap = ${?RAG_CHUNK_OVERLAP}
  }

  # Search settings
  search {
    # Default number of context chunks to retrieve
    top-k = 5
    top-k = ${?RAG_TOP_K}

    # Fusion strategy: rrf, weighted, vector_only, keyword_only
    fusion-strategy = "rrf"
    fusion-strategy = ${?RAG_FUSION_STRATEGY}

    # RRF k parameter (only used with rrf strategy)
    rrf-k = 60
    rrf-k = ${?RAG_RRF_K}
  }

  # Reranking of hybrid-search candidates (llm4s withCohereReranking / withLLMReranking).
  # Not applied in permission mode (llm4s/llm4s#2716).
  reranking {
    # none, cohere (needs COHERE_API_KEY) or llm (reranks with the answer LLM)
    strategy = "none"
    strategy = ${?RAG_RERANKING_STRATEGY}
    # Cohere rerank model
    model = "rerank-english-v3.0"
    model = ${?RAG_RERANKING_MODEL}
    # Number of hybrid-search candidates reranked down to top-k
    candidates = 30
    candidates = ${?RAG_RERANKING_CANDIDATES}
  }

  # Pre-retrieval query transformation (llm4s withQueryTransformer).
  # Not applied in permission mode.
  query-transform {
    # none or llm-rewrite (llm4s LLMQueryRewriter, using the answer LLM)
    strategy = "none"
    strategy = ${?RAG_QUERY_TRANSFORM}
  }

  chat {
    # Earlier messages of a chat session sent to the LLM with each question (0 = none)
    history-messages = 10
    history-messages = ${?RAG_CHAT_HISTORY_MESSAGES}
  }

  # System prompt for answer generation
  system-prompt = """You are a helpful assistant that answers questions based on the provided context.
Use only the information from the context to answer the question.
If the context doesn't contain enough information, say so.
Be concise and accurate."""
  system-prompt = ${?RAG_SYSTEM_PROMPT}
}

# API keys (required - no defaults for security)
api-keys {
  openai = ${?OPENAI_API_KEY}
  openai = ${?OPEN_AI_KEY}
  anthropic = ${?ANTHROPIC_API_KEY}
  voyage = ${?VOYAGE_API_KEY}
  cohere = ${?COHERE_API_KEY}
}

# Security settings
security {
  # Static API key (optional, any mode). Its holder is an administrator. When set in open mode,
  # every request must authenticate (X-API-Key / Authorization: Bearer, or a rat_ access token).
  api-key = ${?API_KEY}

  # With auth.trusted-proxy-headers: let an administrator credential that names an end user
  # (X-User-Id) keep administrator rights by also sending X-Admin: true. Ignored otherwise.
  allow-admin-header = false
  allow-admin-header = ${?ALLOW_ADMIN_HEADER}

  # Authentication configuration
  auth {
    # Authentication mode: open, basic, oauth
    # - open: No authentication required (default)
    # - basic: Username/password with JWT tokens
    # - oauth: OAuth2/OIDC with external identity provider
    mode = "open"
    mode = ${?AUTH_MODE}

    # Trusted proxy mode: a request authenticated as an administrator (e.g. a gateway holding
    # API_KEY) may act for an end user with X-User-Id / X-Group-Ids. Off by default: the
    # headers are stripped and identity always comes from the authenticated credential.
    trusted-proxy-headers = false
    trusted-proxy-headers = ${?AUTH_TRUSTED_PROXY_HEADERS}

    # Basic auth settings (only used when mode = "basic")
    basic {
      # Default admin username
      admin-username = "admin"
      admin-username = ${?ADMIN_USERNAME}

      # Admin password (required when mode = "basic"). Creates the admin account when there are
      # no users yet, and replaces the old default password "admin" if the account still has it.
      # No account is created in open or oauth mode.
      admin-password = ${?ADMIN_PASSWORD}
    }

    # Password policy for user creation, resets, password changes and ADMIN_PASSWORD
    password-min-length = 12
    password-min-length = ${?PASSWORD_MIN_LENGTH}

    # PBKDF2-HMAC-SHA256 iterations for new password hashes. Existing hashes with fewer
    # iterations (or in the pre-PBKDF2 format) are upgraded on the user's next login.
    password-hash-iterations = 600000
    password-hash-iterations = ${?PASSWORD_HASH_ITERATIONS}

    # OAuth2/OIDC settings (only used when mode = "oauth")
    oauth {
      # Provider preset: google, azure, okta, keycloak, custom
      provider = "google"
      provider = ${?OAUTH_PROVIDER}

      # Azure AD tenant ID (only for azure provider)
      azure-tenant-id = ${?OAUTH_AZURE_TENANT_ID}

      # Okta domain (only for okta provider)
      okta-domain = ${?OAUTH_OKTA_DOMAIN}

      # Keycloak settings (only for keycloak provider)
      keycloak-base-url = ${?OAUTH_KEYCLOAK_BASE_URL}
      keycloak-realm = ${?OAUTH_KEYCLOAK_REALM}

      # OAuth client credentials (required for all providers)
      client-id = ${?OAUTH_CLIENT_ID}
      client-secret = ${?OAUTH_CLIENT_SECRET}
      redirect-uri = ${?OAUTH_REDIRECT_URI}

      # Custom provider endpoints (only for custom provider)
      authorization-endpoint = ${?OAUTH_AUTHORIZATION_ENDPOINT}
      token-endpoint = ${?OAUTH_TOKEN_ENDPOINT}
      userinfo-endpoint = ${?OAUTH_USERINFO_ENDPOINT}
      jwks-uri = ${?OAUTH_JWKS_URI}
      issuer = ${?OAUTH_ISSUER}

      # Claim mapping - map OIDC claims to internal user attributes
      claim-mapping {
        user-id = "sub"
        user-id = ${?OAUTH_CLAIM_USER_ID}
        email = "email"
        email = ${?OAUTH_CLAIM_EMAIL}
        groups = "groups"
        groups = ${?OAUTH_CLAIM_GROUPS}
        name = "name"
        name = ${?OAUTH_CLAIM_NAME}
      }

      # Session settings
      session {
        cookie-name = "ragbox_session"
        cookie-name = ${?OAUTH_SESSION_COOKIE_NAME}
        cookie-secure = true
        cookie-secure = ${?OAUTH_SESSION_COOKIE_SECURE}
        cookie-max-age = 86400  # 24 hours in seconds
        cookie-max-age = ${?OAUTH_SESSION_MAX_AGE}
      }

      # Security settings
      pkce-enabled = true
      pkce-enabled = ${?OAUTH_PKCE_ENABLED}
      state-ttl = 300  # 5 minutes in seconds
      state-ttl = ${?OAUTH_STATE_TTL}

      # Where sessions and in-flight login states live: memory | postgres
      session-storage = "memory"
      session-storage = ${?OAUTH_SESSION_STORAGE}

      # Comma-separated groups (from the groups claim) whose members are ragbox administrators.
      # Empty (the default): no SSO user is an administrator; use API_KEY or an admin-scoped
      # access token for administration.
      admin-groups = ${?OAUTH_ADMIN_GROUPS}

      # Scopes to request, space- or comma-separated (must include openid). Unset: the
      # provider preset's scopes (e.g. "openid profile email").
      scopes = ${?OAUTH_SCOPES}
    }

    # JWT settings (basic mode). JWT_SECRET must be 32+ characters and not a placeholder.
    jwt-secret = ${?JWT_SECRET}
    jwt-expiration = 86400  # 24 hours in seconds
    jwt-expiration = ${?JWT_EXPIRATION}
    # iss / aud claims written into and required of every JWT
    jwt-issuer = "rag-in-a-box"
    jwt-issuer = ${?JWT_ISSUER}
    jwt-audience = "rag-in-a-box"
    jwt-audience = ${?JWT_AUDIENCE}
  }
}

# Metrics and observability
metrics {
  # Enable Prometheus metrics endpoint at /metrics
  enabled = false
  enabled = ${?METRICS_ENABLED}

  # Serve /metrics to administrators only (e.g. a scraper sending
  # "Authorization: Bearer <API_KEY>" or an admin-scoped rat_ token). Set false to keep
  # /metrics public, e.g. when only reachable on an internal network.
  require-auth = true
  require-auth = ${?METRICS_REQUIRE_AUTH}
}

# Production hardening settings
production {
  # Rate limiting configuration
  rate-limit {
    # Enable rate limiting (recommended for production)
    enabled = false
    enabled = ${?RATE_LIMIT_ENABLED}

    # Maximum requests per window per IP address
    max-requests = 100
    max-requests = ${?RATE_LIMIT_MAX_REQUESTS}

    # Window size in seconds
    window-seconds = 60
    window-seconds = ${?RATE_LIMIT_WINDOW_SECONDS}

    # Reverse proxies (IPs or CIDRs, comma-separated) whose X-Forwarded-For / X-Real-IP
    # identify the client. From anyone else these headers are ignored and the client is the
    # TCP peer. Unset: no proxy is trusted.
    trusted-proxies = ${?RATE_LIMIT_TRUSTED_PROXIES}

    # Most clients tracked at once; beyond it the oldest windows are evicted
    max-clients = 10000
    max-clients = ${?RATE_LIMIT_MAX_CLIENTS}

    # Login throttling (on even when rate limiting is disabled): failed
    # POST /api/v1/auth/login attempts allowed per client IP and per username per window.
    # 0 disables.
    login {
      max-attempts = 10
      max-attempts = ${?RATE_LIMIT_LOGIN_MAX_ATTEMPTS}
      window-seconds = 300
      window-seconds = ${?RATE_LIMIT_LOGIN_WINDOW_SECONDS}
    }
  }

  # CORS. Default: same-origin only (no CORS headers; the admin UI is same-origin).
  cors {
    # Origins allowed to call the API from a browser, comma-separated
    # (e.g. "https://app.example.com,https://admin.example.com"), or "*" for any origin.
    # An explicit list takes precedence over allow-all-origins.
    allowed-origins = ${?ALLOWED_ORIGINS}

    # Allow every origin when no list is given (not recommended)
    allow-all-origins = false
    allow-all-origins = ${?CORS_ALLOW_ALL_ORIGINS}
  }

  # Request size limiting
  request-size {
    # Enable request size limiting
    enabled = true
    enabled = ${?REQUEST_SIZE_ENABLED}

    # Maximum request body size in MB
    max-body-size-mb = 10
    max-body-size-mb = ${?MAX_BODY_SIZE_MB}
  }

  # Graceful shutdown configuration
  shutdown {
    # Maximum time to wait for in-flight requests
    timeout-seconds = 30
    timeout-seconds = ${?SHUTDOWN_TIMEOUT_SECONDS}

    # Time to drain existing connections
    drain-connections-seconds = 5
    drain-connections-seconds = ${?SHUTDOWN_DRAIN_SECONDS}
  }
}

# Ingestion policy: where ingestion may read from. Applies to the one-shot
# POST /api/v1/ingest/directory and /api/v1/ingest/url endpoints and to configured sources.
ingestion {
  # Directories that directory ingestion may read under (comma-separated, or a list).
  # Paths are compared after resolving symlinks. When unset, the default is the paths of the
  # configured directory sources (e.g. INGEST_DIR); with none, the directory endpoint is disabled.
  allowed-roots = ${?INGEST_ALLOWED_ROOTS}

  url {
    # When set, the only hosts URL and web-crawler ingestion may fetch (comma-separated, or a
    # list). "*.example.com" matches any subdomain of example.com.
    allowed-hosts = ${?INGEST_URL_ALLOWED_HOSTS}

    # URLs whose host resolves to a loopback, private, link-local (incl. cloud metadata),
    # CGNAT, multicast or other non-public address are refused. Set true to skip ragbox's check
    # (e.g. to crawl an intranet). Note: llm4s 0.6.0's loaders still refuse such addresses.
    allow-private-networks = false
    allow-private-networks = ${?INGEST_URL_ALLOW_PRIVATE_NETWORKS}
  }
}

